name: livewire-v3-ecommerce

services:
  php:
    build:
      context: ./docker/php
      args:
        LOCAL_UID: "1000"
        LOCAL_GID: "1000"
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    environment:
      PHP_IDE_CONFIG: serverName=livewire-v3-ecommerce
      COMPOSER_CACHE_DIR: /var/www/html/docker/.cache/composer
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          SCRIPT_NAME=/ping SCRIPT_FILENAME=/ping REQUEST_METHOD=GET
          cgi-fcgi -bind -connect 127.0.0.1:9000 | grep -q pong
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  nginx:
    image: nginx:stable-alpine@sha256:ed84151ed2d47ef93c0939eb9b9754c6990db6092cd2081e11988a47a83d47ea
    ports:
      - "127.0.0.1:18080:80"
    volumes:
      - .:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      php:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/robots.txt"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  mysql:
    image: mysql:8.4@sha256:24989179f58856db763f418010c1169fecc944e3ec1ea7e921572d83eb070f70
    env_file:
      - ./docker/.env
    ports:
      - "127.0.0.1:13306:3306"
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          MYSQL_PWD="$$MYSQL_PASSWORD" mysql --protocol=TCP -h 127.0.0.1
          -u "$$MYSQL_USER" "$$MYSQL_DATABASE" -e 'SELECT 1' >/dev/null
      interval: 5s
      timeout: 5s
      start_period: 30s
      retries: 30
    restart: unless-stopped

  node:
    image: node:22-bookworm-slim@sha256:c3de60bf2f9dd0ac6370e6117950ff62d6e339527e7472301c9c78a017978392
    profiles: [tools]
    init: true
    entrypoint: ["sh", "/var/www/html/docker/node/entrypoint.sh"]
    user: "1000:1000"
    working_dir: /var/www/html
    environment:
      HOME: /tmp
      npm_config_cache: /var/www/html/docker/.cache/npm
    volumes:
      - .:/var/www/html
    command: ["npm", "--version"]

volumes:
  mysql_data:
