server {
    listen 80;
    server_name localhost 127.0.0.1;
    root /var/www/html/public;
    index index.php;
    charset utf-8;
    client_max_body_size 64m;
    server_tokens off;
    resolver 127.0.0.11 valid=10s ipv6=off;

    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /index.php {
        include fastcgi_params;
        set $php_backend php:9000;
        fastcgi_pass $php_backend;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param DOCUMENT_ROOT $document_root;
        fastcgi_param HTTP_PROXY "";
        fastcgi_hide_header X-Powered-By;
    }

    location ~ \.php(?:/|$) { return 404; }
    location ~ /\.(?!well-known(?:/|$)) { return 404; }
    location ~ ^/(?:app|bootstrap|config|database|docker|resources|routes|tests|vendor)(?:/|$) { return 404; }
    location ~ ^/(?:artisan|composer\.(?:json|lock)|package(?:-lock)?\.json|compose\.yaml|phpunit\.xml|.*\.md)$ { return 404; }
    location ~* \.(?:css|js|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        try_files $uri =404;
        expires 1h;
        access_log off;
    }
}
